# cargo-deny (https://embarkstudios.github.io/cargo-deny/): `cargo deny check licenses` checks every dependency's
# licence can ship in PDT, which is Apache-2.0. Only the licences check is configured.

[graph]
all-features = true

[licenses]
# Permissive licences, and MPL-2.0 (file-level copyleft: fine to link unmodified).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates (publish = false).
ignore = true
