# Don't add the `from-pdt` label: triage keys off it (only reports filed from PDT carry it).
name: Feature request
description: Something PDT could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The work it is for, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead
      description: Workarounds, or other tools you use for it.
