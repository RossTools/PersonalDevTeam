name: PDT bundle
description: Builds the installer (nsis), universal app bundle (app) or Linux packages (linux, the headless tarball and the AppImage for the runner's CPU) at the checked-in version and keeps them as a workflow artifact (bundle-<bundles>, bundle-linux-<arch>). It publishes nothing.
inputs:
  bundles:
    description: nsis, app or linux
    required: true
  release:
    description: '"true" for a release build (the release workflow): reports the checked-in version instead of <version>-local, must be signed, and is notarized when the API key is given'
    default: "false"
  version:
    description: A nightly release's version (X.Y.Z-nightly.YYYYMMDD), set in this checkout before building and not committed; empty builds the checked-in one
    default: ''
  signing-p12:
    description: base64 .p12 of the macOS release certificate
    default: ''
  signing-password:
    description: its password
    default: ''
  notary-key:
    description: base64 App Store Connect API key (.p8) for notarization; notarizes when set with the id and issuer
    default: ''
  notary-key-id:
    description: the API key's id
    default: ''
  notary-issuer:
    description: the API key's issuer id
    default: ''
  # PDT's own Google sign-in (its two OAuth clients, the picker key and the project number), built into pdtd; without
  # them a build offers only the user's own OAuth client.
  google-client-id:
    description: the standard Google OAuth client's ID
    default: ''
  google-client-secret:
    description: its secret
    default: ''
  google-agent-client-id:
    description: the agentic Google OAuth client's ID (for agents' document tools)
    default: ''
  google-agent-client-secret:
    description: its secret
    default: ''
  google-picker-key:
    description: the Google file picker's API key
    default: ''
  google-project-number:
    description: the Google Cloud project's number
    default: ''
runs:
  using: composite
  steps:
    # What Tauri needs to build on Linux (WebKitGTK, the tray's appindicator); the AppImage tools run without FUSE.
    - name: Linux build dependencies
      if: inputs.bundles == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential file libwebkit2gtk-4.1-dev libxdo-dev \
          libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
        echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
        echo "PDT_ARCH=$(uname -m)" >> "$GITHUB_ENV"
    - uses: ./.github/actions/pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # The version is the checked-in one (Cargo.toml, matched by tauri.conf.json; scripts/version.sh), or an
    # nightly release's, set here (Cargo.lock follows on the build). Only a release build reports it as is; any
    # other reports <version>-local, which never counts as newer than a release.
    - name: Version
      shell: bash
      env:
        SET_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$SET_VERSION" ]; then scripts/version.sh set "$SET_VERSION"; fi
        version="$(scripts/version.sh)"
        echo "PDT_VERSION=$version" >> "$GITHUB_ENV"
        if [ "${{ inputs.release }}" = true ]; then echo "PDT_BUILD_VERSION=$version" >> "$GITHUB_ENV"; fi
        echo "Building $version (release: ${{ inputs.release }})"
    - run: pnpm --dir web build
      shell: bash
    # The macOS app is universal (Apple silicon and Intel): pdtd and pdt-host are built for both CPUs and joined with
    # lipo (scripts/stage-sidecars.mjs), and Tauri does the same for the app itself. Its bundle is then under
    # target/universal-apple-darwin; the others stay under target/release.
    # PDT's own Google sign-in is built into pdtd (option_env!, crates/pdt-int-google/src/builtin.rs).
    - name: Build pdtd and pdt-host
      shell: bash
      env:
        PDT_GOOGLE_CLIENT_ID: ${{ inputs.google-client-id }}
        PDT_GOOGLE_CLIENT_SECRET: ${{ inputs.google-client-secret }}
        PDT_GOOGLE_AGENT_CLIENT_ID: ${{ inputs.google-agent-client-id }}
        PDT_GOOGLE_AGENT_CLIENT_SECRET: ${{ inputs.google-agent-client-secret }}
        PDT_GOOGLE_PICKER_KEY: ${{ inputs.google-picker-key }}
        PDT_GOOGLE_PROJECT_NUMBER: ${{ inputs.google-project-number }}
      run: |
        if [ "${{ inputs.bundles }}" = app ]; then
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p pdtd -p pdt-host --target aarch64-apple-darwin --target x86_64-apple-darwin
          node scripts/stage-sidecars.mjs --target universal-apple-darwin
          echo "PDT_BUNDLE_DIR=target/universal-apple-darwin/release/bundle" >> "$GITHUB_ENV"
        else
          cargo build --release -p pdtd -p pdt-host
          node scripts/stage-sidecars.mjs
          echo "PDT_BUNDLE_DIR=target/release/bundle" >> "$GITHUB_ENV"
        fi
    - name: Build the bundle
      shell: bash
      run: |
        bundles="${{ inputs.bundles }}"
        target=()
        if [ "$bundles" = linux ]; then bundles=appimage; fi
        if [ "$bundles" = app ]; then target=(--target universal-apple-darwin); fi
        pnpm --dir desktop exec tauri build --config "$GITHUB_WORKSPACE/desktop/src-tauri/tauri.bundle.conf.json" \
          --bundles "$bundles" "${target[@]}"
    # One certificate signs every macOS release (scripts/sign-macos.sh). With a Developer ID certificate the keychain
    # trusts every release; a self-signed one still makes it ask after each update (docs/SDLC.md
    # "Signing"). Releases must be signed; other builds are signed when the secret is available to them.
    - name: Sign the app bundle
      if: inputs.bundles == 'app'
      shell: bash
      env:
        MACOS_SIGNING_P12: ${{ inputs.signing-p12 }}
        MACOS_SIGNING_P12_PASSWORD: ${{ inputs.signing-password }}
      run: |
        if [ -z "$MACOS_SIGNING_P12" ] && [ -z "${PDT_BUILD_VERSION:-}" ]; then
          echo "::notice::No signing certificate; this build is not a release, so it stays ad-hoc signed."
          exit 0
        fi
        scripts/sign-macos.sh "$(ls -d "$PDT_BUNDLE_DIR"/macos/*.app | head -n 1)"
        echo "PDT_SIGNED=true" >> "$GITHUB_ENV"
    # Notarized only when the API key secrets are set (they need a Developer ID signature), and only for releases:
    # Apple's service takes minutes.
    - name: Notarize the app bundle
      if: inputs.bundles == 'app' && inputs.notary-key != '' && inputs.release == 'true'
      shell: bash
      env:
        MACOS_NOTARY_KEY: ${{ inputs.notary-key }}
        MACOS_NOTARY_KEY_ID: ${{ inputs.notary-key-id }}
        MACOS_NOTARY_ISSUER: ${{ inputs.notary-issuer }}
      run: |
        scripts/notarize-macos.sh "$(ls -d "$PDT_BUNDLE_DIR"/macos/*.app | head -n 1)"
        echo "PDT_NOTARIZED=true" >> "$GITHUB_ENV"
    # Every executable in the app runs on both CPUs; a signed app passes codesign's strict check, and a notarized one
    # Gatekeeper's.
    - name: Check the app bundle
      if: inputs.bundles == 'app'
      shell: bash
      run: |
        app="$(ls -d "$PDT_BUNDLE_DIR"/macos/*.app | head -n 1)"
        status=0
        while IFS= read -r exe; do
          archs="$(lipo -archs "$exe")"
          echo "$exe: $archs"
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::$exe is not built for x86_64"; status=1 ;; esac
          case " $archs " in *" arm64 "*) ;; *) echo "::error::$exe is not built for arm64"; status=1 ;; esac
        done < <(find "$app/Contents/MacOS" -type f -perm -u+x)
        if [ "${PDT_SIGNED:-}" = true ]; then codesign --verify --deep --strict --verbose=2 "$app" || status=1; fi
        if [ "${PDT_NOTARIZED:-}" = true ]; then spctl -a -vv "$app" || status=1; fi
        exit "$status"
    # Asset names must match what hosts install (pdt_core::release::select_asset): *-setup.exe, *.app.tar.gz, and on
    # Linux pdt-linux-<arch>.tar.gz and pdt-linux-<arch>.AppImage (<arch>: x86_64 or aarch64, as `uname -m` says).
    - name: Collect the bundle
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/release"
        if [ "${{ inputs.bundles }}" = nsis ]; then
          # Only this version's installer (a cached target dir can hold older ones).
          cp "$PDT_BUNDLE_DIR"/nsis/*_"$PDT_VERSION"_*-setup.exe "$RUNNER_TEMP/release/"
        elif [ "${{ inputs.bundles }}" = linux ]; then
          # The headless tarball: a pdt/ folder with pdtd, pdt-host and the web UI (crates/pdt-host/src/linux.rs).
          stage="$RUNNER_TEMP/tarball"
          rm -rf "$stage" && mkdir -p "$stage/pdt"
          cp target/release/pdtd target/release/pdt-host "$stage/pdt/"
          cp -R web/dist "$stage/pdt/web"
          tar -czf "$RUNNER_TEMP/release/pdt-linux-$PDT_ARCH.tar.gz" -C "$stage" pdt
          # Only this version's AppImage (a cached target dir can hold older ones).
          cp "$PDT_BUNDLE_DIR"/appimage/*_"$PDT_VERSION"_*.AppImage "$RUNNER_TEMP/release/pdt-linux-$PDT_ARCH.AppImage"
        else
          cd "$PDT_BUNDLE_DIR/macos"
          app="$(ls -d *.app | head -n 1)"
          # tar keeps the bundle's symlinks and permissions.
          tar -czf "$RUNNER_TEMP/release/$app.tar.gz" "$app"
        fi
        ls -l "$RUNNER_TEMP/release"
    - uses: actions/upload-artifact@v7
      with:
        name: bundle-${{ inputs.bundles }}${{ inputs.bundles == 'linux' && format('-{0}', env.PDT_ARCH) || '' }}
        path: ${{ runner.temp }}/release/*
        if-no-files-found: error
        retention-days: ${{ inputs.release == 'true' && 30 || 5 }}
