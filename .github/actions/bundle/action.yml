name: PDT bundle
description: Builds the installer (nsis) or app bundle (app); on pushes to main, versions it and uploads it as a release asset.
inputs:
  bundles:
    description: nsis or app
    required: true
  signing-p12:
    description: base64 .p12 of the macOS release certificate
    default: ''
  signing-password:
    description: its password
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Pushes to main are released as 0.1.<run number>; other builds keep the checked-in version.
    - name: Release version
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      run: |
        version="0.1.${{ github.run_number }}"
        echo "PDT_BUILD_VERSION=$version" >> "$GITHUB_ENV"
        printf '{"version":"%s"}' "$version" > "$RUNNER_TEMP/release.conf.json"
        echo "Building release $version"
    - run: pnpm --dir web build
      shell: bash
    - run: cargo build --release -p pdtd -p pdt-host
      shell: bash
    - run: node scripts/stage-sidecars.mjs
      shell: bash
    - name: Build the bundle
      shell: bash
      run: |
        args=(--config "$GITHUB_WORKSPACE/desktop/src-tauri/tauri.bundle.conf.json" --bundles "${{ inputs.bundles }}")
        if [ -n "${PDT_BUILD_VERSION:-}" ]; then args+=(--config "$RUNNER_TEMP/release.conf.json"); fi
        pnpm --dir desktop exec tauri build "${args[@]}"
    # One certificate signs every macOS release, so the keychain keeps trusting pdtd across updates (an ad-hoc
    # signature differs per build and makes pdtd wait on a keychain prompt; scripts/sign-macos.sh). Releases must be
    # signed; other builds are signed when the secret is available to them.
    - name: Sign the app bundle
      if: inputs.bundles == 'app'
      shell: bash
      env:
        MACOS_SIGNING_P12: ${{ inputs.signing-p12 }}
        MACOS_SIGNING_P12_PASSWORD: ${{ inputs.signing-password }}
      run: |
        if [ -z "$MACOS_SIGNING_P12" ] && [ -z "${PDT_BUILD_VERSION:-}" ]; then
          echo "::notice::No signing certificate; this build is not a release, so it stays ad-hoc signed."
          exit 0
        fi
        scripts/sign-macos.sh "$(ls -d target/release/bundle/macos/*.app | head -n 1)"
    # Asset names must match what hosts install (pdt_core::release::asset_suffix): *-setup.exe and *.app.tar.gz.
    - name: Collect the release asset
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/release"
        if [ "${{ inputs.bundles }}" = nsis ]; then
          # Only this version's installer (a cached target dir can hold older ones).
          cp target/release/bundle/nsis/*_"$PDT_BUILD_VERSION"_*-setup.exe "$RUNNER_TEMP/release/"
        else
          cd target/release/bundle/macos
          app="$(ls -d *.app | head -n 1)"
          # tar keeps the bundle's symlinks and permissions.
          tar -czf "$RUNNER_TEMP/release/$app.tar.gz" "$app"
        fi
        ls -l "$RUNNER_TEMP/release"
    - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ inputs.bundles }}
        path: ${{ runner.temp }}/release/*
        if-no-files-found: error
