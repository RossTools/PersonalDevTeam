name: PDT setup
description: Rust toolchain, build cache, and optionally nextest, pnpm and a shell for the terminal tests. Picks the cache by runner.
inputs:
  rust:
    description: install the Rust toolchain and restore the build cache ("false" for jobs that only run a nextest archive)
    default: "true"
  cache-key:
    description: the build cache's key on GitHub's runners (rust-cache's shared-key; cache.yml saves it from main)
    default: ""
  pnpm:
    description: install pnpm and Node, and cache the pnpm store
    default: "false"
  nextest:
    description: install cargo-nextest
    default: "false"
  zsh:
    description: make sure /bin/zsh works (pdtd's terminal tests start it when no shell is given)
    default: "false"
runs:
  using: composite
  steps:
    # Windows Defender scans every file the build and the tests write, which made the Windows tests several times
    # slower than macOS's. GitHub's images run as an administrator; elsewhere this may fail, which only costs time.
    - name: Windows Defender exclusions
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, [IO.Path]::GetTempPath(), "$env:USERPROFILE\.cargo",
          "$env:USERPROFILE\.rustup", $env:CARGO_HOME, $env:RUSTUP_HOME) | Where-Object { $_ } | Select-Object -Unique
        try {
          Add-MpPreference -ExclusionPath $paths -ErrorAction Stop
          Add-MpPreference -ExclusionProcess @('cargo.exe', 'rustc.exe', 'link.exe', 'cargo-nextest.exe') -ErrorAction Stop
          (Get-MpPreference).ExclusionPath
        } catch { Write-Warning "Defender exclusions not set: $_" }
    # Namespace runners (runner names `nsc-runner-*`) keep a cache volume per profile: target/, the cargo registry and
    # the pnpm store persist between runs, and a job that exits cleanly saves its changes. GitHub's runners restore
    # rust-cache (saved by main only) and setup-node's pnpm cache instead.
    - name: Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      run: |
        if ! command -v rustup >/dev/null; then
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        rustup show
    # GitHub's Ubuntu image has zsh; Namespace's has none, and a fresh zsh stops at its first-run menu without
    # ~/.zshrc and at compinit's prompt on Ubuntu.
    - name: zsh
      if: inputs.zsh == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        if [ ! -x /bin/zsh ]; then sudo apt-get update -qq && sudo apt-get install -y -qq zsh >/dev/null; fi
        [ -e ~/.zshrc ] || touch ~/.zshrc
        [ -e ~/.zshenv ] || echo skip_global_compinit=1 > ~/.zshenv
    - uses: ./.github/actions/pnpm
      if: inputs.pnpm == 'true'
    - name: Cache volume (Namespace)
      if: startsWith(runner.name, 'nsc-runner') && inputs.rust == 'true'
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
      with:
        cache: rust
    - name: Rust cache (GitHub)
      if: ${{ inputs.rust == 'true' && !startsWith(runner.name, 'nsc-runner') }}
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # One cache per OS and kind of build (ci.yml and cache.yml use the same keys). It holds the dependencies'
        # build output only (not the workspace's crates) and the cargo registry, under a key from Cargo.lock, the
        # manifests and the toolchain; when those change it restores the newest older one and rebuilds the rest.
        shared-key: ${{ inputs.cache-key }}
        # rust.yml's `--config` for the dependencies' optimisation changes what they build into: part of the key, as
        # the CARGO_* variables are.
        env-vars: DEPS_CONFIG
        # Only main saves (cache.yml): PRs and the queue restore it. Caches are per branch, and PRs and queue runs can
        # read only their own and main's, so a save anywhere else would be read by nobody and fill the 10 GB.
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
      if: inputs.nextest == 'true'
      with:
        tool: cargo-nextest
