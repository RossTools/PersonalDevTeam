name: PDT pnpm
description: pnpm and Node 24, with the pnpm store cached. Only main saves the cache; every other run restores it.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    # No `cache: pnpm` here: setup-node saves its cache from every branch, and caches are per branch, so each PR and
    # queue run stored its own copy of the store (~150 MB) and filled the repo's 10 GB.
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Cache volume (Namespace)
      if: startsWith(runner.name, 'nsc-runner')
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: pnpm
    - id: store
      if: ${{ !startsWith(runner.name, 'nsc-runner') }}
      shell: bash
      run: |
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "key=pnpm-${RUNNER_OS}-${RUNNER_ARCH}-${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"
    # Main (cache.yml, pages.yml) restores and saves; everything else only restores. A changed lockfile restores the
    # newest store for the OS, and pnpm downloads the rest.
    - if: ${{ !startsWith(runner.name, 'nsc-runner') && (github.ref == 'refs/heads/main' || github.ref == 'refs/pull/343/merge') }}
      uses: actions/cache@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.store.outputs.key }}
        restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
    - if: ${{ !startsWith(runner.name, 'nsc-runner') && github.ref != 'refs/heads/main' && github.ref != 'refs/pull/343/merge' }}
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.store.outputs.key }}
        restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
