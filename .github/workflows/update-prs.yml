name: update-prs
# The "Main" ruleset requires a PR to be up to date with main, so every merge leaves the other PRs waiting on
# auto-merge stuck as "behind". After each push to main this merges main into each of those branches (GitHub's
# "Update branch"), so auto-merge carries on with nobody watching. A PR whose update conflicts is left alone and
# listed in the run summary: that one needs an agent.
#
# The update is made as the "PR updater" GitHub App (docs/superpowers/notes/ci.md): its push starts the PR's normal
# CI, which shows on the PR. Without the App (variable PR_UPDATER_CLIENT_ID unset) it falls back to GITHUB_TOKEN,
# whose push GitHub holds for approval, so this dispatches ci.yml on the branch itself.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One at a time: a later push to main updates the branches again anyway.
concurrency:
  group: update-prs
  cancel-in-progress: false

permissions:
  contents: write # the fallback: update-branch with GITHUB_TOKEN
  pull-requests: write
  actions: write # dispatches ci.yml when no PR run starts

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: PR updater App token
        id: app
        if: vars.PR_UPDATER_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.PR_UPDATER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # Merging main into a branch pushes main's workflow changes too, which needs this.
          permission-workflows: write
      - name: Update auto-merge PRs that are behind main
        env:
          # Reads PRs and makes the update.
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          # Looks for the PR's CI run and dispatches one when there is none.
          ACTIONS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Open PRs into main with auto-merge on, from this repo (a fork's branch cannot be pushed to).
          prs="$(gh pr list --repo "$REPO" --base main --state open --limit 100 \
            --json number,headRefName,headRefOid,autoMergeRequest,isCrossRepository \
            --jq '.[] | select(.autoMergeRequest != null and (.isCrossRepository | not)) | "\(.number) \(.headRefName) \(.headRefOid)"')"
          if [ -z "$prs" ]; then echo "No open PRs with auto-merge on."; exit 0; fi
          echo "## Auto-merge PRs" >> "$GITHUB_STEP_SUMMARY"
          # The list comes in on fd 3 so nothing in the loop can read it from stdin.
          while read -r n branch sha <&3; do
            # compare/HEAD...main: commits on main the PR's head lacks.
            if ! behind="$(gh api "repos/$REPO/compare/$sha...main" --jq .ahead_by)"; then
              echo "::warning::#$n: could not compare with main"; continue
            fi
            if [ "$behind" = 0 ]; then
              echo "- #$n is up to date" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            echo "#$n ($branch) is $behind commit(s) behind main; updating"
            # expected_head_sha: never merge over a push that landed since the list was read.
            if ! out="$(gh api -X PUT "repos/$REPO/pulls/$n/update-branch" -f expected_head_sha="$sha" 2>&1)"; then
              echo "::warning::#$n could not be updated with main: $out"
              echo "- #$n **could not be updated** (conflict or a newer push): $out" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # The update is asynchronous: wait for the new head.
            new="$sha"
            for _ in $(seq 1 30); do
              new="$(gh api "repos/$REPO/pulls/$n" --jq .head.sha)"
              [ "$new" != "$sha" ] && break
              sleep 2
            done
            if [ "$new" = "$sha" ]; then
              echo "::warning::#$n: update-branch accepted but the head did not move within 60 s"
              echo "- #$n updated, but the head did not move in time; CI not checked" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # The push should start the PR's CI. If no run starts, or GitHub holds it for approval (a GITHUB_TOKEN
            # push), the required checks would never report: run CI on the branch instead.
            state=""
            for _ in $(seq 1 12); do
              state="$(GH_TOKEN="$ACTIONS_TOKEN" gh run list --repo "$REPO" --workflow ci.yml --event pull_request \
                --commit "$new" --limit 1 --json conclusion,status --jq '.[] | "\(.status)/\(.conclusion)"')"
              [ -n "$state" ] && break
              sleep 5
            done
            if [ -n "$state" ] && [ "$state" != "completed/action_required" ]; then
              echo "- #$n updated with main ($behind behind) → ${new:0:7}; its CI started" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            GH_TOKEN="$ACTIONS_TOKEN" gh workflow run ci.yml --repo "$REPO" --ref "$branch" -f pr="$n"
            echo "- #$n updated with main ($behind behind) → ${new:0:7}; PR run ${state:-missing}, dispatched CI" >> "$GITHUB_STEP_SUMMARY"
          done 3<<< "$prs"
