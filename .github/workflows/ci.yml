name: ci
on:
  # Branches are checked through their pull request; pushing to main (merges) runs CI too.
  push:
    branches: [main]
  pull_request:
    # `labeled`: adding the `windows` or `bundle` label runs those jobs on the PR.
    types: [opened, synchronize, reopened, labeled]
  # The merge queue (the "Main" ruleset): each queued PR is checked on main plus the PR before it is merged.
  merge_group:
    types: [checks_requested]
  workflow_dispatch: {}

# A newer commit on the same PR cancels the older run. A running main run is never cancelled, but a main run still
# queued when a newer push arrives is superseded by it (that only skips a release number).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI never debugs its builds: no debug info makes compiling, linking and the cache much smaller and faster.
  CARGO_PROFILE_DEV_DEBUG: "0"

# What a pull request, and its run in the merge queue, waits for (docs/superpowers/notes/ci.md):
# - nothing but `changes` when it only touches docs (`docs/**` or any `*.md`, except the guides pdtd builds in):
#   every other job is skipped.
# - Linux does the full check set, split into parallel jobs: lint (fmt, clippy), test (nextest, generated TS types)
#   and web (typecheck, vitest, build), on Namespace (8 vCPU, with a cache volume). None of it depends on the OS.
# - build (macos-latest): on Namespace's macOS runner (M4 Pro, 6 vCPU), only what macOS can break: clippy, nextest
#   and the desktop crate. It is most of the Namespace bill (60 units a minute against linux-8's 8), so it runs in
#   the merge queue, and on a PR only with the `macos` label or a change under `.github/`.
# - A push to main skips the Linux and macOS checks: the queue just ran them on the same tree (group size 1, squash
#   merge). Windows checks and the bundles still run there.
# - Repo variables PDT_LINUX_RUNNER / PDT_MACOS_RUNNER override those runners (e.g. ubuntu-latest / macos-latest if
#   Namespace is down); .github/actions/setup picks the cache to match.
# - build (windows-latest): clippy and nextest only; with the `windows` label or a change to Windows-specific files,
#   always on main.
# - bundles: only with the `bundle` label or a change to what they pack; always on main (releases).
# A skipped job still reports its check, which counts as passing for main's required checks; the job names are
# those required checks, so they must not change without changing the ruleset.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.pick.outputs.code }}
      linux: ${{ steps.pick.outputs.linux }}
      macos: ${{ steps.pick.outputs.macos }}
      windows: ${{ steps.pick.outputs.windows }}
      bundle: ${{ steps.pick.outputs.bundle }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          out() { echo "code=$1 linux=$2 macos=$3 windows=$4 bundle=$5"
            { echo "code=$1"; echo "linux=$2"; echo "macos=$3"; echo "windows=$4"; echo "bundle=$5"; } >> "$GITHUB_OUTPUT"; exit 0; }
          all() { out true true true true true; }
          case "$EVENT" in
            pull_request)
              files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)" ;;
            merge_group)
              # Everything the queued group adds to main. Labels come from the PR the queue branch is named after
              # (refs/heads/gh-readonly-queue/main/pr-<n>-<sha>); the ruleset's group size of 1 makes that the PR.
              files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$QUEUE_BASE...$QUEUE_HEAD" --jq '.files[].filename')" || all
              # The compare API lists at most 300 files: past that, run everything.
              [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ] && all
              n="$(printf '%s' "$QUEUE_REF" | sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')"
              LABELS='[]'
              if [ -n "$n" ]; then LABELS="$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')"; fi ;;
            # A push to main (a merge from the queue) only builds the release: the queue ran the Linux and macOS
            # checks on this tree. Windows checks run here because PRs and the queue run them only when asked.
            push) out true false false true true ;;
            # Dispatches run everything.
            *) all ;;
          esac
          printf 'Changed files:\n%s\n' "$files"
          has() { printf '%s' "$LABELS" | grep -q "\"$1\""; }
          # Docs only: every changed file is under docs/ or a Markdown file, and none is a guide pdtd builds in with
          # include_str! (crates/pdt-api/src/guides.rs; its tests check them). An empty list (the diff could not be
          # read) counts as code, so CI never skips by accident.
          code=true
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/|\.md$' \
            && ! printf '%s\n' "$files" | grep -qE '^docs/(agent-guide\.md|run-config\.md|prompts/)'; then code=false; fi
          windows=false; bundle=false
          if has windows || { [ "$code" = true ] && printf '%s\n' "$files" | grep -qiE '(^|/)windows/|\.ps1$|\.cmd$|^\.github/'; }; then windows=true; fi
          if has bundle || { [ "$code" = true ] && printf '%s\n' "$files" | grep -qE '^(desktop/|scripts/|\.github/)'; }; then bundle=true; fi
          # macOS: always in the queue; on a PR only with the label or a change to CI itself.
          macos=false
          if has macos || { [ "$code" = true ] && { [ "$EVENT" = merge_group ] || printf '%s\n' "$files" | grep -qE '^\.github/'; }; }; then macos=true; fi
          out "$code" "$code" "$macos" "$windows" "$bundle"

  lint-linux:
    name: lint (linux)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ${{ vars.PDT_LINUX_RUNNER || 'namespace-profile-linux-8' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test-linux:
    name: test (linux)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ${{ vars.PDT_LINUX_RUNNER || 'namespace-profile-linux-8' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nextest: "true"
          zsh: "true"
      # nextest runs all test binaries at once (cargo test runs them one after another); it also writes the TS types.
      - run: cargo nextest run --profile ci
      - name: Generated TS types are committed
        run: |
          out="$(git status --porcelain -- web/src/api/gen)"; if [ -n "$out" ]; then echo "Generated TS types are out of date:"; echo "$out"; exit 1; fi

  web-linux:
    name: web (linux)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ${{ vars.PDT_LINUX_RUNNER || 'namespace-profile-linux-8' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ !startsWith(runner.name, 'nsc-runner') && 'pnpm' || '' }}
      - name: Cache volume (Namespace)
        if: startsWith(runner.name, 'nsc-runner')
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build

  build-macos:
    name: build (macos-latest)
    needs: changes
    # Skipped for docs-only PRs, unlabelled PRs and pushes to main (the skipped check counts as passing).
    if: needs.changes.outputs.macos == 'true'
    # The job name is a required check, so it keeps "macos-latest" whichever Mac runs it.
    runs-on: ${{ vars.PDT_MACOS_RUNNER || 'namespace-profile-macos-6' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nextest: "true"
          pnpm: "true"
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --profile ci
      # The desktop crate embeds web/dist, so it needs the web build first.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo clippy -p pdt-desktop --all-targets -- -D warnings
      - run: cargo test -p pdt-desktop

  build-windows:
    name: build (windows-latest)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nextest: "true"
      # Only what Windows can break: the web checks, fmt and the generated types run on Linux, and the Windows
      # bundle compiles the desktop crate.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --profile ci

  bundle-macos:
    name: bundle (macos-latest, app)
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/bundle
        with:
          bundles: app
          signing-p12: ${{ secrets.MACOS_SIGNING_P12 }}
          signing-password: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer: ${{ secrets.MACOS_NOTARY_ISSUER }}

  bundle-windows:
    name: bundle (windows-latest, nsis)
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/bundle
        with:
          bundles: nsis

  release:
    # Every push to main becomes a GitHub release v0.1.<run number>, with SHA256SUMS; hosts' pdtd checks for it
    # through the GitHub REST API and pdt-host installs it.
    needs: [lint-linux, test-linux, web-linux, build-macos, build-windows, bundle-macos, bundle-windows]
    # A push to main skips the Linux and macOS checks, and a skipped need would skip this job without `always()`;
    # it still waits for every need and runs only when none failed or was cancelled.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      # GitHub renames uploaded assets with spaces; rename first so SHA256SUMS lists the names hosts will see.
      - name: Checksums
        run: |
          cd assets
          for f in *; do n="${f// /.}"; if [ "$f" != "$n" ]; then mv "$f" "$n"; fi; done
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="v0.1.${{ github.run_number }}"
          subject="$(printf '%s\n' "$HEAD_MESSAGE" | head -n 1)"
          ls -l assets
          # A re-run of this job finds the release already there: replace its assets instead of failing.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes "${subject:-$tag}"
          fi
