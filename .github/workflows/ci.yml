name: ci
on:
  # Branches are checked through their pull request and the merge queue. A push to main (a merge) runs nothing: the
  # queue has just checked that tree, and releases are deliberate (docs/SDLC.md "Releases"), not made per merge.
  pull_request:
    # `labeled`: adding the `windows` or `macos` label runs those jobs on the PR.
    types: [opened, synchronize, reopened, labeled]
  # The merge queue (the "Main" ruleset): each queued PR is checked on main plus the PR before it is merged.
  merge_group:
    types: [checks_requested]
  # Run by hand on a branch: every check, and with `bundles` the macOS app and Windows installer too (kept as workflow
  # artifacts for a few days, never published), to try a packaging change before a release.
  workflow_dispatch:
    inputs:
      bundles:
        description: Build bundles (the macOS app, the Windows installer, the Linux tarball and AppImage; published nowhere)
        type: boolean
        default: true

# A newer commit on the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI never debugs its builds: no debug info makes compiling, linking and the cache much smaller and faster.
  CARGO_PROFILE_DEV_DEBUG: "0"

# What a pull request, and its run in the merge queue, waits for (docs/SDLC.md "CI"):
# - nothing but `changes` and `site` when it only touches docs and the website (`docs/**`, `site/**` or any `*.md`,
#   except the guides pdtd builds in): every other job is skipped.
# - site: builds the website (site/, Astro + Starlight) when `site/**` or `docs/**` changes (the site reads docs/ in
#   place), or the pnpm lockfile or workspace. pages.yml deploys it from main.
# - Linux does the full check set, split into parallel jobs: lint (fmt, clippy), test (nextest, generated TS types;
#   pdtd also without its integration features) and web (typecheck, vitest, build), on Namespace (8 vCPU, with a cache volume). None of it depends on the OS.
# - build (macos-latest): on Namespace's macOS runner (M4 Pro, 6 vCPU), only what macOS can break: clippy, nextest
#   and the desktop crate. It is most of the Namespace bill (60 units a minute against linux-8's 8), so it runs in
#   the merge queue, and on a PR only with the `macos` label or a change under `.github/`.
# - A push to main runs nothing: the queue just ran the checks on the same tree (group size 1, squash merge), and
#   merges are not released (docs/SDLC.md "Releases").
# - Repo variables PDT_LINUX_RUNNER / PDT_MACOS_RUNNER override those runners (e.g. ubuntu-latest / macos-latest if
#   Namespace is down); .github/actions/setup picks the cache to match.
# - build (windows-latest): clippy and nextest only; with the `windows` label or a change to Windows-specific files.
# - bundles: only on the release PR (the `release` branch release.yml opens), as release builds (signed and
#   notarized), so packaging problems show before anything is tagged; never on another PR or in the queue; and when
#   run by hand (workflow_dispatch with `bundles`). They publish nothing here: release.yml publishes the tag's. Linux builds the tarball and AppImage on native x86_64 and arm64
#   runners (bundle (linux, <arch>)); a release's SHA256SUMS lists them with the others.
# - version: the workspace version in Cargo.toml and desktop/src-tauri/tauri.conf.json agree (in `lint (linux)`).
# - changelog: on PRs (not docs-only ones), a changelog fragment or the `no-changelog` label (docs/SDLC.md).
# A skipped job still reports its check, which counts as passing for main's required checks; the job names are
# those required checks, so they must not change without changing the ruleset.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.pick.outputs.code }}
      linux: ${{ steps.pick.outputs.linux }}
      macos: ${{ steps.pick.outputs.macos }}
      windows: ${{ steps.pick.outputs.windows }}
      bundle: ${{ steps.pick.outputs.bundle }}
      release: ${{ steps.pick.outputs.release }}
      site: ${{ steps.pick.outputs.site }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          BUNDLES: ${{ inputs.bundles }}
          RELEASE_PR: ${{ github.event.pull_request.head.ref == 'release' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # The release PR (release.yml's) builds the bundles as release builds; nothing else does.
          release=false
          if [ "$EVENT" = pull_request ] && [ "$RELEASE_PR" = true ]; then release=true; fi
          # The website builds when it or the docs it reads change; with every check (a dispatch, an unreadable diff).
          site=true
          out() { echo "code=$1 linux=$2 macos=$3 windows=$4 bundle=$5 release=$release site=$site"
            { echo "code=$1"; echo "linux=$2"; echo "macos=$3"; echo "windows=$4"; echo "bundle=$5"; echo "release=$release"; echo "site=$site"; } >> "$GITHUB_OUTPUT"; exit 0; }
          all() { out true true true true true; }
          case "$EVENT" in
            pull_request)
              files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)" ;;
            merge_group)
              # Everything the queued group adds to main. Labels come from the PR the queue branch is named after
              # (refs/heads/gh-readonly-queue/main/pr-<n>-<sha>); the ruleset's group size of 1 makes that the PR.
              files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$QUEUE_BASE...$QUEUE_HEAD" --jq '.files[].filename')" || all
              # The compare API lists at most 300 files: past that, run everything.
              [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ] && all
              n="$(printf '%s' "$QUEUE_REF" | sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')"
              LABELS='[]'
              if [ -n "$n" ]; then LABELS="$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')"; fi ;;
            # A dispatch runs every check, and the bundles when asked.
            workflow_dispatch) out true true true true "$([ "$BUNDLES" = true ] && echo true || echo false)" ;;
            *) out true true true true false ;;
          esac
          printf 'Changed files:\n%s\n' "$files"
          has() { printf '%s' "$LABELS" | grep -q "\"$1\""; }
          # The website: site/, the docs it reads, its dependencies (the pnpm lockfile and workspace) or its workflows.
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qE '^(site|docs)/|^pnpm-(lock|workspace)\.yaml$|^\.github/workflows/(ci|pages)\.yml$'; then
            site=false
          fi
          # Docs only: every changed file is under docs/ or site/ or a Markdown file, and none is a guide pdtd builds
          # in with include_str! (crates/pdt-api/src/guides.rs; its tests check them). An empty list (the diff could
          # not be read) counts as code, so CI never skips by accident.
          code=true
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs|site)/|\.md$' \
            && ! printf '%s\n' "$files" | grep -qE '^docs/(agent-guide\.md|run-config\.md|prompts/|user/automation/run-configuration\.md)'; then code=false; fi
          windows=false
          if has windows || { [ "$code" = true ] && printf '%s\n' "$files" | grep -qiE '(^|/)windows/|\.ps1$|\.cmd$|^\.github/'; }; then windows=true; fi
          # macOS: always in the queue; on a PR only with the label or a change to CI itself.
          macos=false
          if has macos || { [ "$code" = true ] && { [ "$EVENT" = merge_group ] || printf '%s\n' "$files" | grep -qE '^\.github/'; }; }; then macos=true; fi
          # Bundles run for the release PR only, never in the queue (the tag builds its own; a dispatch builds them).
          out "$code" "$code" "$macos" "$windows" "$release"

  # A pull request adds a changelog fragment, or carries the `no-changelog` label (docs/SDLC.md "Changelog").
  # Docs-only PRs, the merge queue and main skip it (the queue runs main plus a PR that already passed it).
  changelog:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - run: scripts/changelog.test.sh
      - run: scripts/version.test.sh
      - run: scripts/release-tag.test.sh
      - run: scripts/nightly-tag.test.sh
      - run: scripts/scratch-daemon.test.sh
      - run: scripts/clean-targets.test.sh
      - name: The pull request adds a changelog fragment
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR: ${{ github.event.pull_request.number }}
          RELEASE_PR: ${{ needs.changes.outputs.release }}
        run: |
          # Every unreleased fragment is well formed, whoever added it.
          scripts/changelog.sh check
          # The release PR compiles the fragments into CHANGELOG.md rather than adding one.
          if [ "$RELEASE_PR" = true ]; then echo "The release PR: it compiles the fragments."; exit 0; fi
          added="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | select(.status != "removed") | .filename' | grep -E '^\.changes/unreleased/[^/]+\.md$' || true)"
          if [ -n "$added" ]; then printf 'Fragments:\n%s\n' "$added"; exit 0; fi
          if printf '%s' "$LABELS" | grep -q '"no-changelog"'; then echo "No fragment: the PR has the no-changelog label."; exit 0; fi
          echo "::error title=No changelog fragment::Add .changes/unreleased/<TICKET>.md, or the no-changelog label for a docs, CI or tests-only PR."
          cat <<'EOF'
          This pull request adds no changelog fragment. Add one at .changes/unreleased/<TICKET>.md (for example
          .changes/unreleased/PDT-193.md; a second note for the same ticket is <TICKET>-<anything>.md):

          ---
          kind: fixed
          ---
          One or two sentences, written for people who use PDT, saying what changed for them.

          kind is one of: added, changed, fixed, breaking, internal (internal is left out of the release notes).
          Check it with: scripts/changelog.sh check

          A PR that only changes docs, CI or tests needs no fragment: add the no-changelog label instead (that
          re-runs CI). See docs/SDLC.md "Changelog".
          EOF
          exit 1

  # The website (site/README.md): it builds, with the docs it reads from docs/. pages.yml deploys it from main.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter site...
      # The one-line install scripts the site serves (site/public/; the runner image has shellcheck and pwsh).
      - run: shellcheck site/public/install.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          # It prints to the console on purpose (irm | iex has no other output).
          $found = Invoke-ScriptAnalyzer -Path site/public/install.ps1 -ExcludeRule PSAvoidUsingWriteHost
          $found | Format-Table -AutoSize -Wrap
          if ($found) { exit 1 }
      - run: pnpm --filter site test
      - run: pnpm --filter site build

  lint-linux:
    name: lint (linux)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ${{ vars.PDT_LINUX_RUNNER || 'namespace-profile-linux-8' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The same lint group developers run before pushing: the version (Cargo.toml and tauri.conf.json agree), fmt,
      # clippy, and pdtd with no integration at all as well as with all of them (its default).
      - run: scripts/check.sh --only lint

  test-linux:
    name: test (linux)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ${{ vars.PDT_LINUX_RUNNER || 'namespace-profile-linux-8' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nextest: "true"
          zsh: "true"
      # Linux tests at a version no release has (PDT-216): a test that hard-codes the checked-in version fails on its
      # own PR, not first on the release PR that bumps it. The release PR tests its real version; macOS and Windows
      # always test the checked-in one. Only this job's checkout changes (Cargo.lock follows on the next cargo command).
      - name: Set a stand-in version
        if: needs.changes.outputs.release != 'true'
        run: scripts/version.sh set 9.9.9
      # nextest runs all test binaries at once (cargo test runs them one after another); it also writes the TS types.
      - run: cargo nextest run --profile ci
      # pdtd with no integration built in (the run above has them all; PDT-173).
      - run: cargo nextest run --profile ci -p pdtd --no-default-features
      # The TS types, the web tests' fixtures and the website's plugin list (site/src/data/plugins.json, PDT-281).
      - name: Generated TS types are committed
        run: |
          out="$(git status --porcelain -- web/src/api/gen site/src/data)"; if [ -n "$out" ]; then echo "Generated files are out of date:"; echo "$out"; exit 1; fi

  web-linux:
    name: web (linux)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ${{ vars.PDT_LINUX_RUNNER || 'namespace-profile-linux-8' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ !startsWith(runner.name, 'nsc-runner') && 'pnpm' || '' }}
      - name: Cache volume (Namespace)
        if: startsWith(runner.name, 'nsc-runner')
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck, vitest, build: the web group developers run before pushing.
      - run: scripts/check.sh --only web

  build-macos:
    name: build (macos-latest)
    needs: changes
    # Skipped for docs-only PRs, unlabelled PRs and pushes to main (the skipped check counts as passing).
    if: needs.changes.outputs.macos == 'true'
    # The job name is a required check, so it keeps "macos-latest" whichever Mac runs it.
    runs-on: ${{ vars.PDT_MACOS_RUNNER || 'namespace-profile-macos-6' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nextest: "true"
          pnpm: "true"
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --profile ci
      # The desktop crate embeds web/dist, so it needs the web build first.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo clippy -p pdt-desktop --all-targets -- -D warnings
      - run: cargo test -p pdt-desktop

  build-windows:
    name: build (windows-latest)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nextest: "true"
      # Only what Windows can break: the web checks, fmt and the generated types run on Linux, and the Windows
      # bundle (run by hand, or in a release) compiles the desktop crate.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --profile ci
      - run: pwsh -NoProfile -File scripts/scratch-daemon.test.ps1

  # The bundles keep their names (required checks, skipped on PRs but the release PR, and in the queue). On the release
  # PR they are release builds (the version as is, signed and notarized); run by hand they build the app and installer,
  # signed when the secret is there. Either way they are kept as workflow artifacts and publish nothing.
  bundle-macos:
    name: bundle (macos-latest, app)
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/bundle
        with:
          bundles: app
          release: ${{ needs.changes.outputs.release }}
          signing-p12: ${{ secrets.MACOS_SIGNING_P12 }}
          signing-password: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer: ${{ secrets.MACOS_NOTARY_ISSUER }}

  bundle-windows:
    name: bundle (windows-latest, nsis)
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/bundle
        with:
          bundles: nsis
          release: ${{ needs.changes.outputs.release }}

  # Linux (PDT-197): the headless tarball and the AppImage, each CPU on its own native runner (no cross-compiling).
  # Ubuntu 22.04, so the AppImage and the binaries run on glibc 2.35 and newer.
  bundle-linux:
    name: bundle (linux, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/bundle
        with:
          bundles: linux
          release: ${{ needs.changes.outputs.release }}
