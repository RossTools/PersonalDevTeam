name: ci
on:
  # Branches are checked through their pull request; pushing to main (merges) runs CI too.
  push:
    branches: [main]
  pull_request:
    # `labeled`: adding the `windows` or `bundle` label runs those jobs on the PR.
    types: [opened, synchronize, reopened, labeled]
  # Nightly: the Windows checks on main, in case something only Windows sees slipped in.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

# A newer commit on the same PR cancels the older run. A running main run is never cancelled, but a main run still
# queued when a newer push arrives is superseded by it (that only skips a release number).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI never debugs its builds: no debug info makes compiling, linking and the cache much smaller and faster.
  CARGO_PROFILE_DEV_DEBUG: "0"

# What a pull request waits for (docs/superpowers/notes/ci.md):
# - build (macos-latest): every PR, on the Mac mini's self-hosted runner (warm build, about a minute).
# - build (windows-latest): only with the `windows` label or a change to Windows-specific files; always on main
#   and nightly.
# - bundles: only with the `bundle` label or a change to what they pack; always on main (releases).
# A skipped job still reports its check, which counts as passing for main's required checks; the job names are
# those required checks, so they must not change without changing the ruleset.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.pick.outputs.windows }}
      bundle: ${{ steps.pick.outputs.bundle }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"; echo "bundle=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)"
          printf 'Changed files:\n%s\n' "$files"
          has() { printf '%s' "$LABELS" | grep -q "\"$1\""; }
          windows=false; bundle=false
          if has windows || printf '%s\n' "$files" | grep -qiE '(^|/)windows/|\.ps1$|\.cmd$|^\.github/'; then windows=true; fi
          if has bundle || printf '%s\n' "$files" | grep -qE '^(desktop/|scripts/|\.github/)'; then bundle=true; fi
          echo "windows=$windows bundle=$bundle"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"; echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

  build-macos:
    name: build (macos-latest)
    # The Mac mini (docs/superpowers/notes/ci.md): its build output stays warm between runs, so a PR rebuilds only what changed.
    runs-on: [self-hosted, macOS, ARM64, pdt-mini]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Its own cargo home and target dir, apart from the user's; a cap so the target dir cannot grow forever.
      - name: Runner build dirs
        run: |
          root="$HOME/.cache/pdt-ci"
          mkdir -p "$root"
          size_kb="$(du -sk "$root/target" 2>/dev/null | cut -f1)"
          if [ "${size_kb:-0}" -gt 31457280 ]; then echo "target dir over 30 GB; starting fresh"; rm -rf "$root/target"; fi
          {
            echo "CARGO_HOME=$root/cargo-home"
            echo "CARGO_TARGET_DIR=$root/target"
            # Leaves cores for the agents working on this machine.
            echo "CARGO_BUILD_JOBS=6"
            echo "NEXTEST_TEST_THREADS=6"
          } >> "$GITHUB_ENV"
          echo "$root/cargo-home/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Show Rust toolchain
        run: rustup show
      - uses: ./.github/actions/checks

  build-windows:
    name: build (windows-latest)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves the cache (PRs restore it): PR runs skip uploading ~1 GB, and every PR starts warm.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/checks

  # Releases are built on GitHub's runners, never the Mac mini: a clean machine, and signing never touches its keychain.
  bundle-macos:
    name: bundle (macos-latest, app)
    needs: changes
    if: needs.changes.outputs.bundle == 'true' && github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/bundle
        with:
          bundles: app
          signing-p12: ${{ secrets.MACOS_SIGNING_P12 }}
          signing-password: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer: ${{ secrets.MACOS_NOTARY_ISSUER }}

  bundle-windows:
    name: bundle (windows-latest, nsis)
    needs: changes
    if: needs.changes.outputs.bundle == 'true' && github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/bundle
        with:
          bundles: nsis

  release:
    # Every push to main becomes a GitHub release v0.1.<run number>, with SHA256SUMS; hosts' pdtd checks for it
    # through the GitHub REST API and pdt-host installs it.
    needs: [build-macos, build-windows, bundle-macos, bundle-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      # GitHub renames uploaded assets with spaces; rename first so SHA256SUMS lists the names hosts will see.
      - name: Checksums
        run: |
          cd assets
          for f in *; do n="${f// /.}"; if [ "$f" != "$n" ]; then mv "$f" "$n"; fi; done
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="v0.1.${{ github.run_number }}"
          subject="$(printf '%s\n' "$HEAD_MESSAGE" | head -n 1)"
          ls -l assets
          # A re-run of this job finds the release already there: replace its assets instead of failing.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes "${subject:-$tag}"
          fi
