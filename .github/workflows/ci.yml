name: ci
on:
  # Branches are checked through their pull request and the merge queue. A push to main (a merge) runs nothing: the
  # queue has just checked that tree, and releases are deliberate (docs/SDLC.md "Releases"), not made per merge.
  pull_request:
    # `labeled`: adding the `windows` or `macos` label runs those jobs on the PR.
    types: [opened, synchronize, reopened, labeled]
  # The merge queue (the "Main" ruleset): each queued PR is checked on main plus the PR before it is merged.
  merge_group:
    types: [checks_requested]
  # Run by hand on a branch: every check, and with `bundles` the macOS app and Windows installer too (kept as workflow
  # artifacts for a few days, never published), to try a packaging change before a release.
  workflow_dispatch:
    inputs:
      bundles:
        description: Build bundles (the macOS app, the Windows installer, the Linux tarball and AppImage; published nowhere)
        type: boolean
        default: true

# A newer commit on the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI never debugs its builds: no debug info (none left from std either) and no incremental state make compiling,
  # linking and the cache much smaller and faster. rust.yml and cache.yml set the same (the cache keys include them).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: debuginfo
  CARGO_INCREMENTAL: "0"

# What a pull request, and its run in the merge queue, waits for (docs/SDLC.md "CI"):
# - nothing but `changes`, `secrets` and `site` when it only touches docs and the website (`docs/**`, `site/**` or any `*.md`,
#   except the guides pdtd builds in): every other job is skipped.
# - site: builds the website (site/, Astro + Starlight) when `site/**` or `docs/**` changes (the site reads docs/ in
#   place), or the pnpm lockfile or workspace. pages.yml deploys it from main.
# - Linux does the full check set, split into parallel jobs: lint (fmt, clippy), test (nextest, generated TS types;
#   pdtd also without its integration features) and web (typecheck, vitest, build). None of it depends on the OS.
# - build (macos-latest): only what macOS can break: clippy, nextest and the desktop crate. It runs in the merge
#   queue, and on a PR only with the `macos` label or a change under `.github/`.
# - build (windows-latest): clippy and nextest only. It runs in the merge queue, and on a PR only with the `windows`
#   label or a change to Windows-specific files.
# - The Rust tests (rust.yml) build once per OS into nextest archives and run them in parallel partition jobs; Linux
#   and Windows build the unit and integration tests in two jobs side by side (`split`), macOS in one (its minutes
#   cost the most). The `test (linux)` and `build (…)` jobs here only report rust.yml's result under the required
#   check names.
# - Runners are GitHub's hosted ones unless the repo variables PDT_LINUX_RUNNER / PDT_MACOS_RUNNER /
#   PDT_WINDOWS_RUNNER name others (Namespace profiles, larger runners); PDT_<OS>_PARTITIONS (a JSON list, "[1,2,3]")
#   change the partitions. .github/actions/setup picks the cache to match; cache.yml saves GitHub's from main. A pull
#   request from a fork always runs on GitHub's (the `changes` job picks the runners).
# - A push to main runs nothing here: the queue just ran the checks on the same tree (group size 1, squash merge),
#   and merges are not released (docs/SDLC.md "Releases"). cache.yml rebuilds the build caches when the dependencies
#   change.
# - bundles: only on the release PR (the `release` branch release.yml opens), as release builds (signed and
#   notarized), so packaging problems show before anything is tagged; never on another PR or in the queue; and when
#   run by hand (workflow_dispatch with `bundles`). They publish nothing here: release.yml publishes the tag's. Linux builds the tarball and AppImage on native x86_64 and arm64
#   runners (bundle (linux, <arch>)); a release's SHA256SUMS lists them with the others.
# - version: the workspace version in Cargo.toml and desktop/src-tauri/tauri.conf.json agree (in `lint (linux)`).
# - secrets: gitleaks over the commits the PR or queued group adds, always (.gitleaks.toml allowlists test fixtures).
# - changelog: on PRs (not docs-only ones), a changelog fragment, the `no-changelog` label or `[no-changelog]` in the
#   PR's description (docs/SDLC.md).
# A skipped job still reports its check, which counts as passing for main's required checks; the job names are
# those required checks, so they must not change without changing the ruleset.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.pick.outputs.code }}
      linux: ${{ steps.pick.outputs.linux }}
      macos: ${{ steps.pick.outputs.macos }}
      windows: ${{ steps.pick.outputs.windows }}
      bundle: ${{ steps.pick.outputs.bundle }}
      release: ${{ steps.pick.outputs.release }}
      site: ${{ steps.pick.outputs.site }}
      web: ${{ steps.pick.outputs.web }}
      linux-runner: ${{ steps.runners.outputs.linux }}
      macos-runner: ${{ steps.runners.outputs.macos }}
      windows-runner: ${{ steps.runners.outputs.windows }}
    steps:
      # The runners for the checks: the PDT_<OS>_RUNNER variables, except for a pull request from a fork, which runs
      # on GitHub's hosted runners whatever they name (no paid minutes, and no write to a Namespace cache volume that
      # later runs restore). A fork's PR still waits for a maintainer's approval before it runs at all.
      - id: runners
        env:
          OUTSIDE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          LINUX: ${{ vars.PDT_LINUX_RUNNER || 'ubuntu-latest' }}
          MACOS: ${{ vars.PDT_MACOS_RUNNER || 'macos-latest' }}
          WINDOWS: ${{ vars.PDT_WINDOWS_RUNNER || 'windows-latest' }}
        run: |
          if [ "$OUTSIDE" = true ]; then LINUX=ubuntu-latest MACOS=macos-latest WINDOWS=windows-latest; fi
          echo "linux=$LINUX macos=$MACOS windows=$WINDOWS"
          { echo "linux=$LINUX"; echo "macos=$MACOS"; echo "windows=$WINDOWS"; } >> "$GITHUB_OUTPUT"
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          BUNDLES: ${{ inputs.bundles }}
          RELEASE_PR: ${{ github.event.pull_request.head.ref == 'release' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # The release PR (release.yml's) builds the bundles as release builds; nothing else does.
          release=false
          if [ "$EVENT" = pull_request ] && [ "$RELEASE_PR" = true ]; then release=true; fi
          # The website builds when it or the docs it reads change; with every check (a dispatch, an unreadable diff).
          site=true
          # The web checks, unless a PR changes nothing they read (below).
          web=true
          out() { echo "code=$1 linux=$2 macos=$3 windows=$4 bundle=$5 release=$release site=$site web=$web"
            { echo "code=$1"; echo "linux=$2"; echo "macos=$3"; echo "windows=$4"; echo "bundle=$5"; echo "release=$release"; echo "site=$site"; echo "web=$web"; } >> "$GITHUB_OUTPUT"; exit 0; }
          all() { out true true true true true; }
          case "$EVENT" in
            pull_request)
              files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)" ;;
            merge_group)
              # Everything the queued group adds to main. Labels come from the PR the queue branch is named after
              # (refs/heads/gh-readonly-queue/main/pr-<n>-<sha>); the ruleset's group size of 1 makes that the PR.
              files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$QUEUE_BASE...$QUEUE_HEAD" --jq '.files[].filename')" || all
              # The compare API lists at most 300 files: past that, run everything.
              [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ] && all
              n="$(printf '%s' "$QUEUE_REF" | sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')"
              LABELS='[]'
              if [ -n "$n" ]; then LABELS="$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')"; fi ;;
            # A dispatch runs every check, and the bundles when asked.
            workflow_dispatch) out true true true true "$([ "$BUNDLES" = true ] && echo true || echo false)" ;;
            *) out true true true true false ;;
          esac
          printf 'Changed files:\n%s\n' "$files"
          has() { printf '%s' "$LABELS" | grep -q "\"$1\""; }
          # The website: site/, the docs it reads, its dependencies (the pnpm lockfile and workspace) or its workflows.
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qE '^(site|docs)/|^pnpm-(lock|workspace)\.yaml$|^\.github/workflows/(ci|pages)\.yml$'; then
            site=false
          fi
          # Files under docs/ and site/ that Rust builds in with include_str! and its tests check: the guides pdtd
          # serves (crates/pdt-api/src/guides.rs) and the install scripts.
          builtin='^docs/(agent-guide\.md|run-config\.md|prompts/|user/automation/run-configuration\.md)|^site/public/install\.(sh|ps1)$'
          # Docs only: every changed file is under docs/ or site/ or a Markdown file, and none is built in. An empty
          # list (the diff could not be read) counts as code, so CI never skips by accident.
          code=true
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs|site)/|\.md$' \
            && ! printf '%s\n' "$files" | grep -qE "$builtin"; then code=false; fi
          # Per job on a PR: a change only to web/ (and docs) skips the Rust jobs, and one that touches neither web/,
          # the Node workspace nor CI skips the web jobs. The queue runs both: a few Rust tests read web/ (the brand
          # check), and it is the last check before main.
          rust=$code; web=$code
          if [ "$EVENT" = pull_request ] && [ "$code" = true ] && [ -n "$files" ]; then
            printf '%s\n' "$files" | grep -qE '^web/|^package\.json$|^pnpm-(lock|workspace)\.yaml$|^\.github/|^scripts/check\.sh$' || web=false
            if ! printf '%s\n' "$files" | grep -vE '^web/|^(docs|site)/|\.md$' | grep -q . \
              && ! printf '%s\n' "$files" | grep -qE "$builtin"; then rust=false; fi
          fi
          # Windows: always in the queue (a Windows-only break otherwise reaches main); on a PR only with the label or
          # a change to Windows-specific files or CI.
          windows=false
          if has windows || { [ "$rust" = true ] && { [ "$EVENT" = merge_group ] || printf '%s\n' "$files" | grep -qiE '(^|/)windows/|\.ps1$|\.cmd$|^\.github/'; }; }; then windows=true; fi
          # macOS: always in the queue; on a PR only with the label or a change to CI itself.
          macos=false
          if has macos || { [ "$rust" = true ] && { [ "$EVENT" = merge_group ] || printf '%s\n' "$files" | grep -qE '^\.github/'; }; }; then macos=true; fi
          # Bundles run for the release PR only, never in the queue (the tag builds its own; a dispatch builds them).
          out "$code" "$rust" "$macos" "$windows" "$release"

  # A pull request adds a changelog fragment, or carries the `no-changelog` label or says `[no-changelog]` in its
  # description (docs/SDLC.md "Changelog").
  # Docs-only PRs, the merge queue and main skip it (the queue runs main plus a PR that already passed it).
  changelog:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - run: scripts/changelog.test.sh
      - run: scripts/version.test.sh
      - run: scripts/release-tag.test.sh
      - run: scripts/nightly-tag.test.sh
      - run: scripts/google-build-values.test.sh
      - run: scripts/release-sign.test.sh
      - run: scripts/notarize-macos.test.sh
      - run: scripts/scratch-daemon.test.sh
      - run: scripts/clean-targets.test.sh
      - run: scripts/check-action-pins.sh
      - run: scripts/check-labels.test.sh
      - run: scripts/check-labels.sh
      - name: The pull request adds a changelog fragment
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
          RELEASE_PR: ${{ needs.changes.outputs.release }}
        run: |
          # Every unreleased fragment is well formed, whoever added it.
          scripts/changelog.sh check
          # The release PR compiles the fragments into CHANGELOG.md rather than adding one.
          if [ "$RELEASE_PR" = true ]; then echo "The release PR: it compiles the fragments."; exit 0; fi
          added="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | select(.status != "removed") | .filename' | grep -E '^\.changes/unreleased/[^/]+\.md$' || true)"
          if [ -n "$added" ]; then printf 'Fragments:\n%s\n' "$added"; exit 0; fi
          if printf '%s' "$LABELS" | grep -q '"no-changelog"'; then echo "No fragment: the PR has the no-changelog label."; exit 0; fi
          # The same in the PR's description, for a contributor who can't set labels (the run sees the description as
          # it was at the push or label that started it).
          if printf '%s' "$BODY" | grep -qF '[no-changelog]'; then echo "No fragment: the PR's description says [no-changelog]."; exit 0; fi
          echo "::error title=No changelog fragment::Add .changes/unreleased/<TICKET>.md, or the no-changelog label (or [no-changelog] in the description) for a docs, CI or tests-only PR."
          cat <<'EOF'
          This pull request adds no changelog fragment. Add one at .changes/unreleased/<TICKET>.md (for example
          .changes/unreleased/PDT-193.md, or GH-45.md for an outside PR with no ticket; a second note for the same ticket is <TICKET>-<anything>.md):

          ---
          kind: fixed
          ---
          One or two sentences, written for people who use PDT, saying what changed for them.

          kind is one of: added, changed, fixed, breaking, internal (internal is left out of the release notes).
          Check it with: scripts/changelog.sh check

          A PR that only changes docs, CI or tests needs no fragment: add the no-changelog label instead (that
          re-runs CI). Without permission to label, write [no-changelog] in the PR's description and push again.
          See docs/SDLC.md "Changelog".
          EOF
          exit 1

  # The secret scan: gitleaks over the commits a PR (or the queued group) adds, on every PR, docs-only ones included.
  # .gitleaks.toml allowlists the known test fixtures (docs/SDLC.md "CI"). The release binary, checksum-pinned:
  # gitleaks-action needs a licence for organisations.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          # The commits the PR or the queued group adds; run by hand, the whole history.
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            merge_group) range="$QUEUE_BASE..$QUEUE_HEAD" ;;
            *) range="" ;;
          esac
          echo "Scanning ${range:-every commit}"
          gitleaks git --no-banner --redact --verbose ${range:+--log-opts="$range"} .

  # The website (site/README.md): it builds, with the docs it reads from docs/. pages.yml deploys it from main.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - run: pnpm install --frozen-lockfile --filter site...
      # The one-line install scripts the site serves (site/public/; the runner image has shellcheck and pwsh).
      - run: shellcheck site/public/install.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          # It prints to the console on purpose (irm | iex has no other output).
          $found = Invoke-ScriptAnalyzer -Path site/public/install.ps1 -ExcludeRule PSAvoidUsingWriteHost
          $found | Format-Table -AutoSize -Wrap
          if ($found) { exit 1 }
      - run: pwsh site/src/install.test.ps1
      - run: pnpm --filter site test
      - run: pnpm --filter site build

  lint-linux:
    name: lint (linux)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ${{ needs.changes.outputs.linux-runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: linux-lint
      # The same lint group developers run before pushing: the version (Cargo.toml and tauri.conf.json agree), fmt,
      # clippy, and pdtd with no integration at all as well as with all of them (its default).
      - run: scripts/check.sh --only lint

  # The Rust tests (.github/workflows/rust.yml): one job builds every test binary into a nextest archive, the
  # partition jobs run a slice each. `test (linux)` below is the required check.
  rust-linux:
    name: rust (linux)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    uses: ./.github/workflows/rust.yml
    with:
      os: linux
      runner: ${{ needs.changes.outputs.linux-runner }}
      partitions: ${{ vars.PDT_LINUX_PARTITIONS || '[1,2,3]' }}
      split: true
      release: ${{ needs.changes.outputs.release }}

  test-linux:
    name: test (linux)
    needs: [changes, rust-linux]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.linux == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.rust-linux.result }}
        run: echo "changes $CHANGES, rust (linux) $RESULT"; [ "$CHANGES" = success ] && [ "$RESULT" = success ]

  # The web checks: typecheck and build in one job, vitest split into shards beside it (on GitHub's 4-CPU runners the
  # whole suite takes ~8 min). `web (linux)` reports them under the required check's name.
  web-build:
    name: web (typecheck, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ needs.changes.outputs.linux-runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web knip
      - run: pnpm --dir web build

  web-test:
    name: web (vitest ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.PDT_WEB_SHARDS || '[1,2,3,4]') }}
    runs-on: ${{ needs.changes.outputs.linux-runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web exec vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  web-linux:
    name: web (linux)
    needs: [changes, web-build, web-test]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.web-build.result }}
          TEST: ${{ needs.web-test.result }}
        run: echo "changes $CHANGES, build $BUILD, vitest $TEST"; [ "$CHANGES" = success ] && [ "$BUILD" = success ] && [ "$TEST" = success ]

  # macOS: clippy and the desktop crate's clippy and tests beside the Rust tests in partitions (rust.yml).
  rust-macos:
    name: rust (macos)
    needs: changes
    # Skipped for docs-only PRs, unlabelled PRs and pushes to main (the skipped check counts as passing).
    if: needs.changes.outputs.macos == 'true'
    uses: ./.github/workflows/rust.yml
    with:
      os: macos
      runner: ${{ needs.changes.outputs.macos-runner }}
      partitions: ${{ vars.PDT_MACOS_PARTITIONS || '[1,2]' }}

  # The job name is a required check, so it keeps "macos-latest" whichever Mac runs it.
  build-macos:
    name: build (macos-latest)
    needs: [changes, rust-macos]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.macos == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.rust-macos.result }}
        run: echo "changes $CHANGES, rust (macos) $RESULT"; [ "$CHANGES" = success ] && [ "$RESULT" = success ]

  # Windows: only what Windows can break, clippy and the Rust tests (the web checks, fmt and the generated types run
  # on Linux, and the Windows bundle, run by hand or in a release, compiles the desktop crate).
  rust-windows:
    name: rust (windows)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/rust.yml
    with:
      os: windows
      runner: ${{ needs.changes.outputs.windows-runner }}
      partitions: ${{ vars.PDT_WINDOWS_PARTITIONS || '[1,2,3,4,5,6,7,8]' }}
      split: true

  build-windows:
    name: build (windows-latest)
    needs: [changes, rust-windows]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.windows == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.rust-windows.result }}
        run: echo "changes $CHANGES, rust (windows) $RESULT"; [ "$CHANGES" = success ] && [ "$RESULT" = success ]

  # The bundles keep their names (required checks, skipped on PRs but the release PR, and in the queue). On the release
  # PR they are release builds (the version as is, signed and notarized); run by hand they build the app and installer,
  # signed when the secret is there. Either way they are kept as workflow artifacts and publish nothing.
  # macOS builds each CPU in its own job, side by side and each with its own cache; `bundle (macos-latest, app)` joins
  # them into the universal app, signs, notarizes and checks it (.github/actions/bundle-macos).
  bundle-macos-cpu:
    name: bundle (macos, ${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bundle
        with:
          bundles: app
          target: ${{ matrix.target }}
          release: ${{ needs.changes.outputs.release }}
          google-client-id: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_CLIENT_ID || '' }}
          google-client-secret: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_CLIENT_SECRET || '' }}
          google-agent-client-id: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_AGENT_CLIENT_ID || '' }}
          google-agent-client-secret: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_AGENT_CLIENT_SECRET || '' }}
          google-desktop-client-id: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_DESKTOP_CLIENT_ID || '' }}
          google-desktop-client-secret: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_DESKTOP_CLIENT_SECRET || '' }}
          google-desktop-agent-client-id: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_DESKTOP_AGENT_CLIENT_ID || '' }}
          google-desktop-agent-client-secret: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_DESKTOP_AGENT_CLIENT_SECRET || '' }}
          google-picker-key: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_PICKER_KEY || '' }}
          google-project-number: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_PROJECT_NUMBER || '' }}

  bundle-macos:
    name: bundle (macos-latest, app)
    needs: [changes, bundle-macos-cpu]
    if: needs.changes.outputs.bundle == 'true'
    runs-on: macos-latest
    # Notarizing may wait up to two hours for Apple (the action's notary-timeout-minutes).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bundle-macos
        with:
          release: ${{ needs.changes.outputs.release }}
          signing-p12: ${{ secrets.MACOS_SIGNING_P12 }}
          signing-password: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer: ${{ secrets.MACOS_NOTARY_ISSUER }}

  bundle-windows:
    name: bundle (windows-latest, nsis)
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bundle
        with:
          bundles: nsis
          release: ${{ needs.changes.outputs.release }}
          google-client-id: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_CLIENT_ID || '' }}
          google-client-secret: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_CLIENT_SECRET || '' }}
          google-agent-client-id: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_AGENT_CLIENT_ID || '' }}
          google-agent-client-secret: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_AGENT_CLIENT_SECRET || '' }}
          google-desktop-client-id: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_DESKTOP_CLIENT_ID || '' }}
          google-desktop-client-secret: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_DESKTOP_CLIENT_SECRET || '' }}
          google-desktop-agent-client-id: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_DESKTOP_AGENT_CLIENT_ID || '' }}
          google-desktop-agent-client-secret: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_DESKTOP_AGENT_CLIENT_SECRET || '' }}
          google-picker-key: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_PICKER_KEY || '' }}
          google-project-number: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_PROJECT_NUMBER || '' }}

  # Linux (PDT-197): the headless tarball and the AppImage, each CPU on its own native runner (no cross-compiling).
  # Ubuntu 22.04, so the AppImage and the binaries run on glibc 2.35 and newer.
  bundle-linux:
    name: bundle (linux, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bundle
        with:
          bundles: linux
          release: ${{ needs.changes.outputs.release }}
          google-client-id: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_CLIENT_ID || '' }}
          google-client-secret: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_CLIENT_SECRET || '' }}
          google-agent-client-id: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_AGENT_CLIENT_ID || '' }}
          google-agent-client-secret: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_AGENT_CLIENT_SECRET || '' }}
          google-desktop-client-id: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_DESKTOP_CLIENT_ID || '' }}
          google-desktop-client-secret: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_DESKTOP_CLIENT_SECRET || '' }}
          google-desktop-agent-client-id: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_DESKTOP_AGENT_CLIENT_ID || '' }}
          google-desktop-agent-client-secret: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_DESKTOP_AGENT_CLIENT_SECRET || '' }}
          google-picker-key: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_PICKER_KEY || '' }}
          google-project-number: ${{ needs.changes.outputs.release == 'true' && secrets.PDT_GOOGLE_PROJECT_NUMBER || '' }}
