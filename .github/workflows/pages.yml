name: pages
# The website (site/, Astro + Starlight; site/README.md) on GitHub Pages. It reads docs/ in place, so a merge that
# changes either deploys it. ci.yml's `site` job builds it on pull requests and in the merge queue.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Monthly too, so /.well-known/security.txt (written at build time, valid for 180 days) never expires.
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

# One deploy at a time; a newer merge waits rather than cancelling one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Not on a fork: it has no Pages site (configure-pages would fail), and contributors' pushes to their main deploy
    # nothing. `deploy` needs this job, so it skips too.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # configure-pages looks the Pages site up, which the workflow's contents: read alone doesn't allow.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and the tags: the landing page counts tickets, merged PRs and releases from them.
          fetch-depth: 0
      - uses: ./.github/actions/pnpm
      # The URL Pages serves the site at (its custom domain or github.io address; the site makes an http:// one https://).
      - id: pages
        uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile --filter site...
      - run: pnpm --filter site build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    # The github-pages environment only takes deploys from main: a workflow_dispatch on a branch checks the build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
