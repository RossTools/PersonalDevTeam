name: audit
# Known advisories in the dependencies (docs/SDLC.md "CI"): `cargo deny check advisories` over Cargo.lock (deny.toml
# lists the ignored ones, each with its reason) and `pnpm audit --audit-level high` over pnpm-lock.yaml.
# Not a required check: a new advisory is about the dependencies, not about the PR that meets it, so it shouldn't
# block unrelated merges. It runs on a PR that changes the lockfiles or this config, and daily on main, so an advisory
# published between Dependabot runs turns up as a failed scheduled run.
on:
  pull_request:
    paths:
      - Cargo.lock
      - pnpm-lock.yaml
      - deny.toml
      - .github/workflows/audit.yml
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: audit (cargo deny)
    # A fork's schedule would spend its owner's minutes on an audit nobody reads.
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The release binary, checksum-pinned (as ci.yml's gitleaks): no Rust toolchain or build needed.
      - name: Install cargo-deny
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-$VERSION-x86_64-unknown-linux-musl"
          curl -fsSL -o cargo-deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  cargo-deny.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cargo-deny"
          tar -xzf cargo-deny.tar.gz -C "$RUNNER_TEMP/cargo-deny" --strip-components=1 "$name/cargo-deny"
          rm cargo-deny.tar.gz
          echo "$RUNNER_TEMP/cargo-deny" >> "$GITHUB_PATH"
      - run: cargo-deny --locked check advisories

  pnpm-audit:
    name: audit (pnpm)
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pnpm audit reads the lockfile: no install, so no store cache.
      - uses: pnpm/action-setup@v6
      - run: pnpm audit --audit-level high
