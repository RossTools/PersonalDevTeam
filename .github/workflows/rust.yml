name: rust
# The Rust checks for one OS, for ci.yml (and cache.yml, which only builds, to save the cache): build once, test in
# parallel partitions. ci.yml's aggregate jobs (`test (linux)`, `build (macos-latest)`, `build (windows-latest)`) carry
# the required check names; these jobs' names are not required checks (docs/SDLC.md "CI").
#
# - clippy (macOS, Windows): clippy for their `cfg` code, and on macOS the desktop crate's clippy and tests, beside
#   the build so it adds no wall time. Linux lints in ci.yml's `lint (linux)`.
# - build: compiles every test binary once into a nextest archive, an artifact for the partitions. With `split`, two
#   build jobs side by side: the unit tests (`--lib --bins`) and the integration tests (`--test '*'`), an archive each.
#   The build is CPU-bound, so two runners halve the work each does; both select the same packages, so they build
#   the dependencies with the same features and share the build cache.
# - minimal (Linux): pdtd's tests without its integrations, a build of its own beside the others.
# - test: the archives' tests, split into `partitions` jobs (`--partition slice:i/N` of each archive). They need no Rust
#   toolchain.
on:
  workflow_call:
    inputs:
      os:
        description: linux, macos or windows
        type: string
        required: true
      runner:
        description: runs-on label (ci.yml picks it from the PDT_<OS>_RUNNER repo variables)
        type: string
        required: true
      partitions:
        description: 'The test partitions, as a JSON list: "[1,2,3]" runs three'
        type: string
        default: "[1,2]"
      split:
        description: Build the unit tests and the integration tests in two jobs side by side (never when warm)
        type: boolean
        default: false
      warm:
        description: Only build (no tests, no archive), so cache.yml saves the build cache from main
        type: boolean
        default: false
      release:
        description: '"true" on the release PR: Linux tests the real version rather than the stand-in 9.9.9'
        type: string
        default: "false"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # CI never debugs its builds: no debug info (and none left from std), no incremental state. Compiling, linking, the
  # archive and the cache are smaller and faster. The caches' keys include these, so ci.yml and cache.yml agree.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: debuginfo
  CARGO_INCREMENTAL: "0"
  # Windows links with LLVM's lld (shipped with Rust) rather than MSVC's link.exe, which is much slower.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld

jobs:
  clippy:
    if: inputs.os != 'linux'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ inputs.os }}-clippy
          pnpm: ${{ inputs.os == 'macos' }}
      - run: cargo clippy --all-targets -- -D warnings
      # The desktop crate embeds web/dist, so it needs the web build first.
      - if: inputs.os == 'macos'
        run: pnpm install --frozen-lockfile && pnpm --dir web build
      - if: inputs.os == 'macos'
        run: cargo clippy -p pdt-desktop --all-targets -- -D warnings
      # Here rather than in build, so the partitions don't wait for it.
      - if: inputs.os == 'macos'
        run: cargo test -p pdt-desktop
      - if: inputs.os == 'windows' && !inputs.warm
        run: pwsh -NoProfile -File scripts/scratch-daemon.test.ps1

  build:
    name: build (${{ matrix.tests }})
    strategy:
      matrix:
        # cache.yml's warm build is one job: the cache it saves holds the dependencies both halves use.
        tests: ${{ fromJSON(inputs.split && !inputs.warm && '["unit","integration"]' || '["all"]') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      ARCHIVE: nextest-${{ inputs.os }}-${{ matrix.tests }}.tar.zst
      TESTS: ${{ matrix.tests }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ inputs.os }}-build
          nextest: "true"
          zsh: ${{ inputs.os == 'linux' }}
      # Linux tests at a version no release has (PDT-216): a test that hard-codes the checked-in version fails on its
      # own PR, not first on the release PR that bumps it. The release PR tests its real version; macOS and Windows
      # always test the checked-in one. The partitions set it too, so the files match the binaries.
      - name: Set a stand-in version
        if: inputs.os == 'linux' && inputs.release != 'true'
        run: scripts/version.sh set 9.9.9
      # `--timings`: cargo's report of what compiled when (the critical path), kept as an artifact to see what to speed
      # up next.
      - run: |
          case "$TESTS" in
            unit) set -- --lib --bins ;;
            integration) set -- --test '*' ;;
            *) set -- ;;
          esac
          cargo nextest archive --profile ci --archive-file "$ARCHIVE" --timings "$@"
      - if: ${{ !inputs.warm }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1
          # zstd already.
          compression-level: 0
      - if: ${{ !inputs.warm && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ inputs.os }}-${{ matrix.tests }}
          path: target/cargo-timings/cargo-timing.html
          retention-days: 7
          if-no-files-found: ignore

  # pdtd with no integration built in (the archive has them all; PDT-173). Its own job: the build without the
  # features recompiles pdt-api and pdtd, which took 2.5 min after the archive.
  minimal:
    if: inputs.os == 'linux'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ inputs.os }}-minimal
          nextest: "true"
          zsh: "true"
      - name: Set a stand-in version
        if: inputs.release != 'true'
        run: scripts/version.sh set 9.9.9
      - if: ${{ !inputs.warm }}
        run: cargo nextest run --profile ci -p pdtd --no-default-features
      - if: inputs.warm
        run: cargo nextest archive --profile ci -p pdtd --no-default-features --archive-file "$RUNNER_TEMP/minimal.tar.zst"

  test:
    name: test (${{ matrix.partition }})
    needs: build
    if: ${{ !inputs.warm }}
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(inputs.partitions) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          nextest: "true"
          zsh: ${{ inputs.os == 'linux' }}
      - name: Set a stand-in version
        if: inputs.os == 'linux' && inputs.release != 'true'
        run: scripts/version.sh set 9.9.9
      - uses: actions/download-artifact@v8
        with:
          pattern: nextest-${{ inputs.os }}-*.tar.zst
          merge-multiple: true
      # Extracted into the checkout, so target/ sits where the build had it: tests find the fake binaries at their
      # compile-time paths (env!("CARGO_BIN_EXE_…")). `cargo-nextest` directly, as `cargo` would install the toolchain.
      # Each archive in turn (one, or the unit and integration tests' two); a failure in one still runs the other.
      - name: nextest (partition ${{ matrix.partition }} of ${{ strategy.job-total }})
        env:
          PARTITION: slice:${{ matrix.partition }}/${{ strategy.job-total }}
        run: |
          failed=0
          for archive in nextest-${{ inputs.os }}-*.tar.zst; do
            echo "::group::$archive"
            cargo-nextest nextest run --profile ci --archive-file "$archive" --workspace-remap . --extract-to . \
              --extract-overwrite --partition "$PARTITION" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      # The tests write the TS types, the web tests' fixtures and the website's plugin list (site/src/data/plugins.json,
      # PDT-281); each partition checks the ones its tests wrote.
      - name: Generated files are committed
        if: inputs.os == 'linux'
        run: |
          out="$(git status --porcelain -- web/src/api/gen site/src/data)"; if [ -n "$out" ]; then echo "Generated files are out of date:"; echo "$out"; exit 1; fi
