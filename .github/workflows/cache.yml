name: cache
# Saves the Rust build caches and pnpm stores ci.yml restores on GitHub's runners (docs/SDLC.md "Caching"). Caches are scoped to a
# branch, and PRs and the merge queue can read only their own and main's; ci.yml never runs on main, so this does:
# the same builds as ci.yml's jobs, with the same cache keys, saved from main. Each cache holds the dependencies'
# build output and the cargo registry; its key changes with Cargo.lock, the manifests and the toolchain, so it only
# rebuilds when they change, plus weekly (GitHub drops caches unused for 7 days).
# Runners on Namespace (the PDT_<OS>_RUNNER variables) keep their own cache volume, so their OS is skipped here.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .cargo/config.toml
      - pnpm-lock.yaml
      - .github/actions/setup/**
      - .github/actions/pnpm/**
      - .github/scripts/prune-caches.sh
      - .github/workflows/cache.yml
      - .github/workflows/rust.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: cache
  cancel-in-progress: true

permissions:
  contents: read

env:
  # As ci.yml's and rust.yml's: the cache keys include it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: debuginfo
  CARGO_INCREMENTAL: "0"

jobs:
  # ci.yml's `lint (linux)`.
  lint-linux:
    if: ${{ !startsWith(vars.PDT_LINUX_RUNNER, 'namespace-') }}
    runs-on: ${{ vars.PDT_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: linux-lint
      - run: scripts/check.sh --only lint

  rust-linux:
    if: ${{ !startsWith(vars.PDT_LINUX_RUNNER, 'namespace-') }}
    uses: ./.github/workflows/rust.yml
    with:
      os: linux
      runner: ${{ vars.PDT_LINUX_RUNNER || 'ubuntu-latest' }}
      warm: true

  rust-macos:
    if: ${{ !startsWith(vars.PDT_MACOS_RUNNER, 'namespace-') }}
    uses: ./.github/workflows/rust.yml
    with:
      os: macos
      runner: ${{ vars.PDT_MACOS_RUNNER || 'macos-latest' }}
      warm: true

  rust-windows:
    if: ${{ !startsWith(vars.PDT_WINDOWS_RUNNER, 'namespace-') }}
    uses: ./.github/workflows/rust.yml
    with:
      os: windows
      runner: ${{ vars.PDT_WINDOWS_RUNNER || 'windows-latest' }}
      warm: true

  # The Linux pnpm store (macOS's comes with rust-macos; Windows runs no web checks).
  pnpm-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - run: pnpm install --frozen-lockfile

  # Only main's newest caches are any use: PRs and queue runs read only their own branch's and main's, and a save
  # replaces an older key (an older Cargo.lock or pnpm-lock.yaml) without removing it. Once the new caches are saved,
  # this keeps the newest per kind on main and deletes the rest (caches other branches saved, and old ones such as
  # keys from before a Cargo.lock or toolchain change), so the repo stays inside its 10 GB. The bundles' caches
  # (release.yml's nightlies save them) count as kinds too: main's newest of each stays.
  prune:
    needs: [lint-linux, rust-linux, rust-macos, rust-windows, pnpm-linux]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    # Job permissions replace the workflow's: the checkout needs contents too.
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/prune-caches.sh
