[workspace]
resolver = "3"
members = ["crates/*", "desktop/src-tauri"]
default-members = ["crates/pdt-core", "crates/pdt-git", "crates/pdt-store", "crates/pdt-api", "crates/pdt-agents", "crates/pdtd", "crates/pdt-tailscale", "crates/pdt-forge", "crates/pdt-github", "crates/pdt-update", "crates/pdt-host", "crates/pdt-int-discord", "crates/pdt-int-jira", "crates/pdt-int-buildkite", "crates/pdt-int-arr", "crates/pdt-int-scryer", "crates/pdt-int-plex", "crates/pdt-int-gitlab", "crates/pdt-int-google", "crates/pdt-sheet"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
pdt-core = { path = "crates/pdt-core" }
pdt-git = { path = "crates/pdt-git" }
pdt-store = { path = "crates/pdt-store" }
pdt-api = { path = "crates/pdt-api" }
pdt-agents = { path = "crates/pdt-agents" }
pdt-tailscale = { path = "crates/pdt-tailscale" }
pdt-forge = { path = "crates/pdt-forge" }
pdt-github = { path = "crates/pdt-github" }
pdt-update = { path = "crates/pdt-update" }
pdt-host = { path = "crates/pdt-host" }
pdt-int-discord = { path = "crates/pdt-int-discord" }
pdt-int-jira = { path = "crates/pdt-int-jira" }
pdt-int-buildkite = { path = "crates/pdt-int-buildkite" }
pdt-int-arr = { path = "crates/pdt-int-arr" }
pdt-int-scryer = { path = "crates/pdt-int-scryer" }
pdt-int-plex = { path = "crates/pdt-int-plex" }
pdt-int-gitlab = { path = "crates/pdt-int-gitlab" }
pdt-sheet = { path = "crates/pdt-sheet" }
pdt-int-google = { path = "crates/pdt-int-google" }

tokio = { version = "1.53.3", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip", "compression-br"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# no-serde-warnings: ts-rs ignores the serde attributes it has no TS meaning for (alias,
# deserialize_with, deny_unknown_fields) and would print a warning for each on every build.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v7"] }
jiff = "0.2.38"

# Debug builds (and `cargo test`) keep line tables only, so backtraces still show file and line, and no debug info for
# dependencies: full debug info made every test binary ~160 MB (docs/dev/testing.md "Build output"). For a debugger
# that shows variables, build with CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
