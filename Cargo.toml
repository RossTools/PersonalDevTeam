[workspace]
resolver = "3"
members = ["crates/*", "desktop/src-tauri"]
default-members = ["crates/pdt-core", "crates/pdt-git", "crates/pdt-store", "crates/pdt-api", "crates/pdt-agents", "crates/pdtd", "crates/pdt-tailscale", "crates/pdt-update"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
pdt-core = { path = "crates/pdt-core" }
pdt-git = { path = "crates/pdt-git" }
pdt-store = { path = "crates/pdt-store" }
pdt-api = { path = "crates/pdt-api" }
pdt-agents = { path = "crates/pdt-agents" }
pdt-tailscale = { path = "crates/pdt-tailscale" }
pdt-update = { path = "crates/pdt-update" }

tokio = { version = "1.53.3", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = "12.0.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v7"] }
jiff = "0.2.38"
