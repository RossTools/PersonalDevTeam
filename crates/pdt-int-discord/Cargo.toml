[package]
name = "pdt-int-discord"
description = "Discord (PDT-98): webhooks Post to Discord steps post to, and a bot the PM manages a server with."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# One integration test binary (tests/main.rs) rather than one per file: each links all of PDT (docs/dev/testing.md).
autotests = false

[dependencies]
pdt-core.workspace = true
pdt-api.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
schemars = "1.2.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "system-proxy", "query", "multipart"] }
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = "0.3.34"

[dev-dependencies]
pdt-store.workspace = true
pdt-forge.workspace = true
tower.workspace = true
sqlx.workspace = true
tempfile = "3.27.0"
http-body-util = "0.1.5"
tracing-subscriber.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
