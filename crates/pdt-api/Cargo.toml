[package]
name = "pdt-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# One integration test binary (tests/main.rs) rather than one per file: each links all of PDT (docs/dev/testing.md).
autotests = false

[dependencies]
pdt-core.workspace = true
pdt-forge.workspace = true
pdt-git.workspace = true
pdt-agents.workspace = true
pdt-store.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
serde.workspace = true
ts-rs.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
jiff.workspace = true
serde_json.workspace = true
futures-util = "0.3.34"
keyring = "4.2.0"
thiserror.workspace = true
pdt-tailscale.workspace = true
pdt-github.workspace = true
pdt-update.workspace = true
flate2 = "1.1.10"
tokio-tungstenite = "0.30.0"
sha2 = "0.11.1"
schemars = "1.2.3"
hmac = "0.13.0"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "system-proxy", "query"] }
rmcp = { version = "3.6.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
async-trait = "0.1.92"
base64 = "0.23.1"
fs4 = "1.1.0"

[dev-dependencies]
tower.workspace = true
tempfile = "3.27.0"
http-body-util = "0.1.5"
hex = "0.4.3"
sqlx.workspace = true
tracing-subscriber.workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[[test]]
name = "integration"
path = "tests/main.rs"

# Sets API keys in the environment: alone in its process, so no other test sees them.
[[test]]
name = "checks_env"
path = "tests/checks_env.rs"
