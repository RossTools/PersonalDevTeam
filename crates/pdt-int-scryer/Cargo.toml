[package]
name = "pdt-int-scryer"
description = "Scryer (films, series and anime): library, search, add, queue, and its GraphQL API for the PM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# One integration test binary (tests/main.rs) rather than one per file: each links all of PDT (docs/dev/testing.md).
autotests = false

[dependencies]
pdt-core.workspace = true
pdt-api.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
schemars = "1.2.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "system-proxy", "query"] }
tracing.workspace = true
apollo-compiler = "1.33.1"

[dev-dependencies]
pdt-store.workspace = true
pdt-forge.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
sqlx.workspace = true
tempfile = "3.27.0"
http-body-util = "0.1.5"

[[test]]
name = "integration"
path = "tests/main.rs"
