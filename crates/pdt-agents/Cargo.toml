[package]
name = "pdt-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One integration test binary (tests/main.rs) rather than one per file: each links all of PDT (docs/dev/testing.md).
autotests = false

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures-util = "0.3.34"
jiff.workspace = true
pdt-core.workspace = true
portable-pty = "0.9.0"
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "process", "io-util"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["full"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[[test]]
name = "integration"
path = "tests/main.rs"
