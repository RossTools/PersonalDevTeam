[package]
name = "pdt-int-jira"
description = "Jira Cloud (PDT-85): projects link to a site; assigned issues become tickets, Done moves the issue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One integration test binary (tests/main.rs) rather than one per file: each links all of PDT (docs/dev/testing.md).
autotests = false

[dependencies]
pdt-core.workspace = true
pdt-api.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
schemars = "1.2.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "system-proxy", "query"] }
axum.workspace = true
pdt-store.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono = "0.4.45"

[dev-dependencies]
pdt-forge.workspace = true
tower.workspace = true
sqlx.workspace = true
tempfile = "3.27.0"
http-body-util = "0.1.5"

[[test]]
name = "integration"
path = "tests/main.rs"
