[package]
name = "pdtd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# One integration test binary (tests/main.rs) rather than one per file: each links all of PDT (docs/dev/testing.md).
autotests = false

[dependencies]
pdt-core.workspace = true
pdt-store.workspace = true
pdt-api.workspace = true
tokio.workspace = true
axum.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs = "7.0.0"
tracing-appender = "0.2.5"
jiff.workspace = true
pdt-tailscale.workspace = true
pdt-github.workspace = true
pdt-forge.workspace = true
serde_json.workspace = true
pdt-update.workspace = true
pdt-git.workspace = true
uuid.workspace = true
pdt-int-discord = { workspace = true, optional = true }
pdt-int-jira = { workspace = true, optional = true }
pdt-int-buildkite = { workspace = true, optional = true }
pdt-int-gitlab = { workspace = true, optional = true }
pdt-int-google = { workspace = true, optional = true }
pdt-int-arr = { workspace = true, optional = true }
pdt-int-scryer = { workspace = true, optional = true }
pdt-int-plex = { workspace = true, optional = true }

# One feature per integration (PDT-173); release builds have them all, and a build may leave any out
# (`--no-default-features --features jira,…`). An instance enables the ones it uses in Settings → Plugins.
[features]
default = ["discord", "jira", "buildkite", "gitlab", "google", "arr", "scryer", "plex"]
discord = ["dep:pdt-int-discord"]
jira = ["dep:pdt-int-jira"]
buildkite = ["dep:pdt-int-buildkite"]
gitlab = ["dep:pdt-int-gitlab"]
google = ["dep:pdt-int-google"]
arr = ["dep:pdt-int-arr"]
scryer = ["dep:pdt-int-scryer"]
plex = ["dep:pdt-int-plex"]

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "integration"
path = "tests/main.rs"
