# PDT's own run configuration: a dev instance of PDT on its own port and data folder, reachable
# at the run's link.
#
# - PDT sets PDT_OWNER_LOGIN itself when the host has an owner, so the dev instance admits the host's owner. It is not
#   repeated in `env`: an unset variable would be passed on as the literal text "$PDT_OWNER_LOGIN".
# - The command is `cargo run -q -p pdtd`, not `target/debug/pdtd`: Windows runs each step through a generated .cmd
#   where `target/debug/pdtd` is not a command (forward slashes), and `target\debug\pdtd` would not work under sh.
#   Setup has already built it, so cargo only starts it.
# - PDT_WEB_DIR is relative to the checkout, which is the working folder of every step.
# - PDT_SECRET_STORE=memory keeps dev instances out of the keychain. They are not supervised, so they never update.
# - PDT_SEED=demo fills a new (empty) data folder with demo projects, sessions and runs; Reset data starts it over.
[[run]]
name    = "pdt"
setup   = "pnpm install --frozen-lockfile && pnpm --dir web build && cargo build -p pdtd"
command = "cargo run -q -p pdtd"
web     = true
data    = true
env     = { PDT_PROFILE = "dev", PDT_PORT = "$PORT", PDT_DATA_DIR = "$PDT_RUN_DATA", PDT_WEB_DIR = "web/dist", PDT_ALLOWED_HOSTS = "$PDT_RUN_HOST:$PORT", PDT_SECRET_STORE = "memory", PDT_SEED = "demo" }

[[test]]
name    = "rust"
command = "cargo test"

[[test]]
name    = "web"
command = "pnpm --dir web test"


# Areas (docs/user/automation/run-configuration.md "Areas"): parts of PDT that two tickets in flight at once would both touch. Starting a
# ticket warns when its areas or changed files overlap another active ticket's; only `migrations` is exclusive (two
# branches changing the schema at once can clash, even with timestamped migration names). A file may sit in more than
# one area (`crates/pdt-api/src/workflow/pipeline.rs` is in `persona prompts` and `workflows`): overlap compares area
# names and changed files, never which area a file came from.
#
# Hot areas (the project's Settings, "Hot areas"; PDT keeps them per host, not here): `api routes`, `mcp tools`,
# `persona prompts` and `agent docs`, the files most often in merge conflicts. Marking `workflows` or `inbox and
# notifications` hot is the same per-host setting. Auto-start doesn't start a ticket in a hot area while another
# ticket in it is in flight.
[[area]]
name      = "migrations"
paths     = ["crates/pdt-store/migrations/**"]
exclusive = true

[[area]]
name  = "design system"
paths = ["web/ui/**"]

[[area]]
name  = "tickets"
paths = ["crates/pdt-core/src/ticket.rs", "crates/pdt-core/src/start.rs", "crates/pdt-core/src/overlap.rs",
         "crates/pdt-core/src/links.rs", "crates/pdt-core/src/rank.rs", "crates/pdt-store/src/tickets/**",
         "crates/pdt-api/src/tickets.rs", "crates/pdt-api/src/start.rs", "crates/pdt-api/src/overlap.rs",
         "web/src/tickets/**"]

[[area]]
name  = "terminals"
paths = ["crates/pdt-agents/**", "crates/pdt-api/src/pty_ws.rs", "crates/pdt-api/src/sessions.rs",
         "crates/pdt-api/src/activity.rs", "web/src/terminal/**", "web/src/sessions/**"]

[[area]]
name  = "runs"
paths = ["crates/pdt-core/src/run.rs", "crates/pdt-core/src/runconfig.rs", "crates/pdt-store/src/runs.rs",
         "crates/pdt-api/src/run*.rs", "web/src/runs/**", "docs/run-config.md",
         "docs/user/automation/run-configuration.md"]

[[area]]
name  = "workspaces"
paths = ["crates/pdt-core/src/workspace.rs", "crates/pdt-store/src/workspaces.rs", "crates/pdt-api/src/workspaces.rs",
         "web/src/workspaces/**"]

[[area]]
name  = "host and updates"
paths = ["crates/pdt-host/**", "crates/pdt-update/**", "crates/pdt-api/src/update.rs", "desktop/**", "scripts/**"]

[[area]]
name  = "ci"
paths = [".github/**"]

[[area]]
name  = "api routes"
paths = ["crates/pdt-api/src/routes.rs", "crates/pdt-api/src/lib.rs", "web/src/api/**"]

[[area]]
name  = "mcp tools"
paths = ["crates/pdt-api/src/mcp/**"]

[[area]]
name  = "persona prompts"
paths = ["crates/pdt-core/src/persona.rs", "crates/pdt-api/src/workflow/pipeline.rs", "docs/prompts/**"]

[[area]]
name  = "agent docs"
paths = ["AGENTS.md", "CLAUDE.md", "docs/agent-guide.md", "docs/run-config.md", "docs/dev/**"]

[[area]]
name  = "workflows"
paths = ["crates/pdt-core/src/workflow/**", "crates/pdt-core/src/workflow_runs.rs", "crates/pdt-api/src/workflow/**",
         "web/src/workflows/**"]

[[area]]
name  = "inbox and notifications"
paths = ["crates/pdt-core/src/inbox.rs", "crates/pdt-core/src/notification.rs", "crates/pdt-api/src/inbox.rs",
         "crates/pdt-api/src/notifications.rs", "web/src/inbox/**", "web/src/notifications/**"]

# Generated files at merge time (docs/user/automation/run-configuration.md "Generated files at merge time"): when only
# these conflict as PDT brings a branch up to date with main, it takes main's side and runs the command, in this order
# (the lockfiles first, so the TypeScript types build against them). The types come from ts-rs's `export_bindings`
# tests in each crate's lib tests.
[[merge.regenerate]]
paths = ["Cargo.lock"]
run   = "cargo update -w"

[[merge.regenerate]]
paths = ["pnpm-lock.yaml"]
run   = "pnpm install"

[[merge.regenerate]]
paths = ["web/src/api/gen/**"]
run   = "cargo test --workspace --lib export_bindings"
